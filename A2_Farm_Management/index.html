<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarvestGuard - Farmer Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Connection Status -->
        <div id="connection-status" class="connection-status disconnected">
            <span data-i18n="connecting">Connecting to Firebase...</span>
        </div>

        <!-- Language Selector -->
        <div class="lang-switch">
            <select id="languageSelect" onchange="updateLanguage()">
                <option value="en">English</option>
                <option value="bn">বাংলা</option>
            </select>
        </div>

        <!-- VIEW 1: REGISTRATION PAGE -->
        <div id="view-register" class="card">
            <h2 data-i18n="regTitle">Farmer Registration</h2>
            <form id="form-register" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label data-i18n="lblPhone">Phone Number</label>
                    <input type="text" id="reg-phone" required placeholder="01712345678" pattern="[0-9]{11}">
                </div>
                <div class="form-group">
                    <label data-i18n="lblName">Full Name</label>
                    <input type="text" id="reg-name" required placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label data-i18n="lblEmail">Email</label>
                    <input type="email" id="reg-email" required placeholder="farmer@mail.com">
                </div>
                <div class="form-group">
                    <label data-i18n="lblPass">Password</label>
                    <input type="password" id="reg-pass" required minlength="6">
                </div>
                <button type="submit" data-i18n="btnRegister">Register</button>
            </form>
            <p style="text-align:center; margin-top: 15px;">
                <span data-i18n="haveAccount">Already have an account?</span>
                <a href="#" onclick="showView('view-login'); return false;" data-i18n="btnLogin">Login</a>
            </p>
        </div>

        <!-- VIEW 2: LOGIN PAGE -->
        <div id="view-login" class="card">
            <h2 data-i18n="loginTitle">Login</h2>
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label data-i18n="lblPhone">Phone Number</label>
                    <input type="text" id="login-phone" required placeholder="01712345678" pattern="[0-9]{11}">
                </div>
                <div class="form-group">
                    <label data-i18n="lblPass">Password</label>
                    <input type="password" id="login-pass" required>
                </div>
                <button type="submit" data-i18n="btnLogin">Login</button>
            </form>
            <p style="text-align:center; margin-top: 15px;">
                <span data-i18n="noAccount">No account?</span>
                <a href="#" onclick="showView('view-register'); return false;" data-i18n="btnRegister">Register</a>
            </p>
        </div>

        <!-- VIEW 3: DASHBOARD -->
        <div id="view-dashboard" class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="user-welcome" style="margin: 0;">Welcome</h2>
                <button onclick="handleLogout()" class="danger" style="width: auto; padding: 8px 16px;">
                    <span data-i18n="btnLogout">Logout</span>
                </button>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-box">
                    <div data-i18n="lblBatches">Batches</div>
                    <div class="stat-val" id="stat-count">0</div>
                </div>
                <div class="stat-box">
                    <div data-i18n="lblTotalWeight">Total Weight</div>
                    <div class="stat-val" id="stat-weight">0 kg</div>
                </div>
            </div>

            <!-- Badges -->
            <div style="margin-bottom: 20px;">
                <h3 data-i18n="lblBadges">Achievements</h3>
                <div id="badge-container">
                    <span style="color:#999; font-size:12px">No badges yet</span>
                </div>
            </div>

            <!-- Actions -->
            <button onclick="showView('view-add-batch')" data-i18n="btnAddBatch">+ Add Crop Batch</button>
            <button onclick="exportCSV()" class="secondary" data-i18n="btnExport">Download Data (CSV)</button>

            <!-- History Table -->
            <h3 data-i18n="lblHistory" style="margin-top: 30px;">History</h3>
            <table id="table-batches">
                <thead>
                    <tr>
                        <th data-i18n="lblDate">Date</th>
                        <th data-i18n="lblCrop">Crop</th>
                        <th data-i18n="lblWeight">Weight</th>
                        <th data-i18n="lblStorage">Storage</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="4" style="text-align:center; color:#999;">No batches yet</td></tr>
                </tbody>
            </table>
        </div>

        <!-- VIEW 4: ADD CROP BATCH -->
        <div id="view-add-batch" class="card">
            <h2 data-i18n="titleAddBatch">Add Crop Batch</h2>
            <form id="form-add-batch" onsubmit="handleAddBatch(event)">
                <div class="form-group">
                    <label data-i18n="lblDate">Date</label>
                    <input type="date" id="batch-date" required>
                </div>
                <div class="form-group">
                    <label data-i18n="lblCrop">Crop Type</label>
                    <select id="batch-crop" required>
                        <option value="">Select...</option>
                        <option value="Rice">Rice / ধান</option>
                        <option value="Wheat">Wheat / গম</option>
                        <option value="Jute">Jute / পাট</option>
                        <option value="Potato">Potato / আলু</option>
                        <option value="Vegetables">Vegetables / সবজি</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="lblWeight">Weight (kg)</label>
                    <input type="number" id="batch-weight" required min="1" step="0.1">
                </div>
                <div class="form-group">
                    <label data-i18n="lblDivision">Division</label>
                    <select id="batch-division" required onchange="updateDistricts()">
                        <option value="">Select...</option>
                        <option value="Dhaka">Dhaka</option>
                        <option value="Chittagong">Chittagong</option>
                        <option value="Rajshahi">Rajshahi</option>
                        <option value="Khulna">Khulna</option>
                        <option value="Barisal">Barisal</option>
                        <option value="Sylhet">Sylhet</option>
                        <option value="Rangpur">Rangpur</option>
                        <option value="Mymensingh">Mymensingh</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="lblDistrict">District</label>
                    <select id="batch-district" required disabled>
                        <option value="">Select division first...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="lblStorage">Storage Location</label>
                    <input type="text" id="batch-storage" required placeholder="e.g., Warehouse A">
                </div>
                <button type="submit" data-i18n="btnSave">Save Batch</button>
                <button type="button" onclick="showView('view-dashboard')" class="secondary" data-i18n="btnCancel">Cancel</button>
            </form>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
